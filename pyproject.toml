[project]
name = "lean-invoice-tracker"
version = "0.1.0"
description = "Self-hosted lightweight invoice tracker built with FastAPI and SQLite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "reportlab>=4.2.0",
]
