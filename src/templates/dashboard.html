<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lean Invoice Tracker</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {}
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-gray-100 p-8">
    <main class="max-w-4xl mx-auto space-y-8">
        <header class="border-b border-gray-800 pb-4">
            <h1 class="text-2xl font-mono tracking-wider text-green-400">LEAN_INVOICE_TRACKER //</h1>
        </header>

        <!-- Time Log Input Form Component -->
        <section class="bg-gray-800 p-6 rounded border border-gray-700">
            <h2 class="text-lg font-bold mb-4">Log Daily Operations</h2>
            <form id="log-form"
                  hx-post="/api/logs"
                  hx-target="#unbilled-table-container"
                  hx-on::after-request="if(event.detail.successful) { this.reset(); htmx.trigger(document.body, 'refreshUnbilled'); }"
                  class="grid grid-cols-5 gap-4">
                <select name="client_id" id="client-select" required
                        class="bg-gray-900 border border-gray-700 p-2 rounded">
                    <option value="">Select Client</option>
                </select>
                <input type="date" name="date" id="log-date"
                       class="bg-gray-900 border border-gray-700 p-2 rounded">
                <input type="number" step="0.25" name="hours" placeholder="Hours"
                       class="bg-gray-900 border border-gray-700 p-2 rounded">
                <input type="text" name="description" placeholder="Task execution metrics..."
                       class="bg-gray-900 border border-gray-700 p-2 rounded col-span-2">
                <button type="submit"
                        class="bg-green-600 hover:bg-green-700 text-white font-bold p-2 rounded col-span-5">
                    Commit Work Log
                </button>
            </form>
            <p class="text-gray-400 text-sm mt-4">
                Note: Client dropdown is populated via HTMX on page load from <code>/api/clients</code> endpoint.
            </p>
        </section>

        <!-- Unbilled Logs Table (HTMX-driven) -->
        <section id="unbilled-table-container"
                 hx-get="/api/logs/unbilled"
                 hx-trigger="load">
            <div class="bg-gray-800 p-6 rounded border border-gray-700">
                <p class="text-gray-500">Loading...</p>
            </div>
        </section>

        <!-- Client Management -->
        <section class="bg-gray-800 p-6 rounded border border-gray-700">
            <h2 class="text-lg font-bold mb-4">Clients</h2>
            <form id="add-client-form"
                  hx-post="/api/clients"
                  hx-swap="none"
                  hx-on::after-request="handleClientFormResponse(event)"
                  class="grid grid-cols-5 gap-4 mb-6">
                <input type="text" name="name" placeholder="Client name" required
                       class="bg-gray-900 border border-gray-700 p-2 rounded col-span-2">
                <input type="email" name="email" placeholder="Email" required
                       class="bg-gray-900 border border-gray-700 p-2 rounded col-span-2">
                <input type="text" name="billing_address" placeholder="Billing address"
                       class="bg-gray-900 border border-gray-700 p-2 rounded">
                <input type="number" step="0.01" name="default_hourly_rate" placeholder="Hourly rate"
                       class="bg-gray-900 border border-gray-700 p-2 rounded">
                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold p-2 rounded col-span-5">
                    Add Client
                </button>
            </form>
            <div id="clients-container"
                 hx-get="/api/clients/html"
                 hx-trigger="load">
                <div class="bg-gray-800 p-6 rounded border border-gray-700">
                    <p class="text-gray-500">Loading...</p>
                </div>
            </div>
            <div id="delete-message" class="mt-3"></div>
        </section>

        <!-- Invoice Generation -->
        <section class="bg-gray-800 p-6 rounded border border-gray-700">
            <h2 class="text-lg font-bold mb-4">Generate Invoice</h2>
            <form id="invoice-form"
                  onsubmit="return handleInvoiceSubmit(event)"
                  class="grid grid-cols-3 gap-4">
                <select name="client_id" id="invoice-client-select" required
                        class="bg-gray-900 border border-gray-700 p-2 rounded col-span-2">
                    <option value="">Select Client</option>
                </select>
                <button type="submit"
                        class="bg-green-600 hover:bg-green-700 text-white font-bold p-2 rounded">
                    Generate Invoice
                </button>
            </form>
            <div id="invoice-message" class="mt-3"></div>
        </section>

        <!-- Invoice History -->
        <section class="bg-gray-800 p-6 rounded border border-gray-700">
            <h2 class="text-lg font-bold mb-4">Invoice History</h2>
            <div id="invoices-container"
                 hx-get="/api/invoices/html"
                 hx-trigger="load">
                <div class="bg-gray-800 p-6 rounded border border-gray-700">
                    <p class="text-gray-500">Loading...</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Handle HTMX responses -->
    <script>
        // --- Shared helpers ---
        function refreshClientsTable() {
            fetch('/api/clients/html')
                .then(r => r.text())
                .then(h => document.getElementById('clients-container').innerHTML = h);
        }
        function refreshClientDropdowns() {
            fetch('/api/clients')
                .then(r => r.json())
                .then(clients => {
                    const opts = '<option value="">Select Client</option>' +
                        clients.map(c => '<option value="' + c.id + '">' + c.name + ' (' + c.default_hourly_rate + '/h)</option>').join('');
                    document.querySelectorAll("select[name='client_id']").forEach(s => s.innerHTML = opts);
                });
        }
        function showMessage(elementId, text, isError) {
            const el = document.getElementById(elementId);
            if (el) {
                el.innerHTML = '<p class="text-' + (isError ? 'red' : 'green') + '-400 text-sm">' + text + '</p>';
                setTimeout(() => { el.innerHTML = ''; }, 5000);
            }
        }
        function parseErrorMessage(responseText) {
            try { return JSON.parse(responseText).detail; }
            catch (e) { return 'Request failed.'; }
        }

        // --- Add Client Form ---
        function handleClientFormResponse(event) {
            if (event.detail.successful) {
                document.getElementById('add-client-form').reset();
                refreshClientsTable();
                refreshClientDropdowns();
            } else {
                showMessage('delete-message', '✗ ' + parseErrorMessage(event.detail.xhr.responseText), true);
            }
        }

        // --- Invoice Form ---
        function handleInvoiceSubmit(event) {
            const select = document.getElementById('invoice-client-select');
            const clientId = select.value;
            if (!clientId) {
                showMessage('invoice-message', '✗ Please select a client.', true);
                event.preventDefault();
                return false;
            }
            event.preventDefault();

            // Create invoice, then download PDF using Blob API
            fetch('/api/clients/' + clientId + '/invoices', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            })
            .then(async r => {
                if (!r.ok) {
                    const err = await r.json();
                    throw new Error(err.detail || 'Failed');
                }
                return r.json();
            })
            .then(data => {
                showMessage('invoice-message', '✓ Invoice generated successfully.', false);
                // Download PDF via Blob
                return fetch('/api/invoices/' + data.id + '/pdf')
                    .then(r => r.blob())
                    .then(blob => {
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = data.invoice_number + '.pdf';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                    });
            })
            .then(() => {
                // Refresh tables in background
                fetch('/api/logs/unbilled')
                    .then(r => r.text())
                    .then(h => document.getElementById('unbilled-table-container').innerHTML = h);
                fetch('/api/invoices/html')
                    .then(r => r.text())
                    .then(h => document.getElementById('invoices-container').innerHTML = h);
                refreshClientDropdowns();
            })
            .catch(() => {
                showMessage('invoice-message', '✗ Failed to generate invoice.', true);
            });
            return false;
        }

        // Handle HTMX delete response
        document.addEventListener("htmx:afterRequest", function(event) {
            const detail = event.detail;
            if (detail.requestConfig && detail.requestConfig[0] &&
                detail.requestConfig[0].method === "DELETE" &&
                detail.requestConfig[0].pathInfo &&
                detail.requestConfig[0].pathInfo.pathSegments &&
                detail.requestConfig[0].pathInfo.pathSegments[0] === "/api/clients") {

                if (detail.successful) {
                    showMessage('delete-message', '✓ Client deleted successfully.', false);
                    fetch("/api/clients/html")
                        .then(res => res.text())
                        .then(html => {
                            document.getElementById("clients-container").innerHTML = html;
                        });
                    fetch("/api/clients")
                        .then(res => res.json())
                        .then(clients => {
                            const options = '<option value="">Select Client</option>' +
                                clients.map(c =>
                                    '<option value="' + c.id + '">' + c.name + ' (' + c.default_hourly_rate + '/h)</option>'
                                ).join("");
                            document.querySelectorAll("select[name='client_id']").forEach(sel => {
                                sel.innerHTML = options;
                            });
                        });
                } else {
                    showMessage('delete-message', '✗ ' + parseErrorMessage(detail.xhr.responseText), true);
                }
            }
        });

        // Listen for refreshUnbilled trigger to reload the unbilled logs table
        document.addEventListener("refreshUnbilled", function() {
            fetch("/api/logs/unbilled")
                .then(res => res.text())
                .then(html => {
                    document.getElementById("unbilled-table-container").innerHTML = html;
                });
        });

        // Populate all client dropdowns once on page load
        document.addEventListener("DOMContentLoaded", function() {
            refreshClientDropdowns();
        });

    </script>
</body>
</html>
